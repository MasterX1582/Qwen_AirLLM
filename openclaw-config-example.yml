# OpenClaw Configuration for Qwen3.5 Local Inference
# Add this to your existing OpenClaw config

providers:
  # Your existing providers (anthropic, openai, etc.)
  # ...
  
  # Add Qwen local provider
  qwen-local:
    api: openai-completions
    baseURL: http://localhost:8000/v1
    apiKey: dummy  # Not used by AirLLM server, but required by config schema
    models:
      - Qwen/Qwen3.5-397B-A17B

models:
  # Your existing model configs
  # ...
  
  # Add Qwen local model
  qwen-local:
    provider: qwen-local
    model: Qwen/Qwen3.5-397B-A17B
    maxTokens: 8192
    temperature: 0.7
    # Optional: Set as default
    # default: true

# To set as default model via CLI:
# openclaw config set models.default qwen-local

# To use for specific session:
# openclaw chat --model qwen-local

# To test:
# echo "Hello from OpenClaw!" | openclaw chat --model qwen-local
