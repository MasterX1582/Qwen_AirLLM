# Qwen AirLLM Server Configuration
# This file is mounted from host - edit here, restart container (no rebuild needed)

server:
  host: "0.0.0.0"
  port: 8000
  log_level: "info"

model:
  path: "/models/Qwen3.5-397B-A17B"
  max_tokens: 4096
  temperature: 0.7

inference:
  # AirLLM settings
  cache_dir: "/cache"
  layer_shards_saving_path: "/cache/layer_shards"

  # Number of transformer layers to keep in GPU VRAM simultaneously.
  # Leave unset (or set to null) for auto-detection based on available VRAM.
  # Set manually to override: e.g. 2 for large MoE models, 8+ for smaller models.
  n_layers_in_gpu: null

  # Generation defaults
  max_new_tokens: 1024
  temperature: 0.7
  top_p: 0.9
  top_k: 50

api:
  # OpenAI compatibility settings
  model_name: "Qwen/Qwen3.5-397B-A17B"
  
logging:
  directory: "/app/logs"
  filename: "qwen-server.log"
  max_size: "100MB"
  backup_count: 5
