services:
  qwen-inference:
    build: .
    image: qwen-airllm:latest
    container_name: qwen-inference
    ports:
      - "8888:8000"
    volumes:
      # Model files (read-only)
      - D:/AI-Models:/models:ro
      # AirLLM cache (persistent, speeds up restarts)
      - D:/qwen-data/cache:/cache
      # Server config (mount from host, no rebuild needed for changes)
      - ./config:/app/config:ro
      # Logs (persistent)
      - D:/qwen-data/logs:/app/logs
    environment:
      - MODEL_PATH=/models/Qwen3.5-397B-A17B
      - CACHE_DIR=/cache
      - CUDA_VISIBLE_DEVICES=0
      # Point AirLLM to cache directory
      - AIRLLM_CACHE_DIR=/cache
      - HF_HOME=/cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
